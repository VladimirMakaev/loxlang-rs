[package]
edition = "2021"
name = "loxlang-rs"
version = "0.1.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.79"
logos = "0.13.0"
strum = {version = "0.26.1", features = ["derive"]}
thiserror = "1.0.56"
tracing = "0.1.40"
